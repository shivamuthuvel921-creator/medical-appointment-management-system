<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-card {
      background: white;
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-lg);
    }
    .login-card h1 {
      color: var(--primary);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .login-card .subtitle {
      font-size: 0.85rem;
      color: var(--gray-400);
      margin-bottom: 1.5rem;
    }
    .password-wrap { position: relative; }
    .password-wrap input { width: 100%; padding-right: 3.5rem; }
    .toggle-password {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
    }
    .toggle-password:hover { background: var(--primary-light); }
    .login-footer { text-align: center; margin-top: 1rem; }
    .login-footer a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/doctor-details.html">Doctors</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your appointments</p>

      <form id="login-form">
        <input type="text" name="username" placeholder="User name" required />
        <input type="tel" name="mobile" placeholder="Mobile number" required />
        <input type="email" name="email" placeholder="Email address" required />
        <div class="password-wrap">
          <input id="password-field" type="password" name="password" placeholder="Password" required />
          <button type="button" class="toggle-password" id="toggle-password">Show</button>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
      </form>

      <p class="login-footer"><a href="/home.html">Continue without signing in →</a></p>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const passwordField = document.getElementById('password-field');
    const togglePassword = document.getElementById('toggle-password');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordField.type === 'password';
      passwordField.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = form.elements.username.value.trim() || 'User';
      localStorage.setItem('medcare-current-user', username);
      window.location.href = '/home.html';
    });
  </script>
</body>
</html>
