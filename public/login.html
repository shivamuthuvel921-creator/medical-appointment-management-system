<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/doctor-details.html">Doctors</a>
      <a href="/register.html">Register</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <div class="auth-kicker">Sign In</div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your appointments</p>

      <form id="login-form">
        <input type="email" name="email" placeholder="Email address" required autocomplete="email" />
        <div class="password-wrap">
          <input id="password-field" type="password" name="password" placeholder="Password" required autocomplete="current-password" />
          <button type="button" class="toggle-password" id="toggle-password">Show</button>
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Sign In</button>
      </form>

      <p class="login-footer">Don't have an account? <a href="/register.html">Register here</a></p>
      <p class="login-footer"><a href="/forgot-password.html">Forgot password?</a></p>
      <p class="login-footer"><a href="/home.html">Continue without signing in →</a></p>
    </div>
  </div>

  <script type="module">
    import { saveAuth, getToken } from './auth.js';

    if (getToken()) window.location.href = '/home.html';

    const form = document.getElementById('login-form');
    const passwordField = document.getElementById('password-field');
    const togglePassword = document.getElementById('toggle-password');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordField.type === 'password';
      passwordField.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      const formData = new FormData(form);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: formData.get('email').toString().trim(),
            password: formData.get('password').toString(),
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Login failed';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return;
        }

        saveAuth(data.token, data.user);
        window.location.href = '/home.html';
      } catch {
        errorEl.textContent = 'Network error — please try again';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
