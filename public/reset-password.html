<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: white; border-radius: var(--radius); padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
    .login-card h1 { color: var(--primary); font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
    .login-card .subtitle { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 1.5rem; }
    .password-wrap { position: relative; }
    .password-wrap input { width: 100%; padding-right: 3.5rem; }
    .toggle-password { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.5rem; border-radius: 4px; }
    .toggle-password:hover { background: var(--primary-light); }
    .form-error { color: var(--danger); font-size: 0.8rem; font-weight: 500; text-align: center; min-height: 1.2rem; }
    .login-footer { text-align: center; margin-top: 1rem; }
    .login-footer a { color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Choose a new password</h1>
      <p class="subtitle">Set a new password for your account.</p>

      <form id="reset-form">
        <div class="password-wrap">
          <input id="password-field" type="password" name="password" placeholder="New password (min 8 chars)" required autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggle-password">Show</button>
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Update Password</button>
      </form>

      <p class="login-footer"><a href="/login.html">Back to login</a></p>
    </div>
  </div>

  <script type="module">
    const token = new URLSearchParams(window.location.search).get('token');
    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');
    const passwordField = document.getElementById('password-field');
    const toggle = document.getElementById('toggle-password');

    toggle.addEventListener('click', () => {
      const hidden = passwordField.type === 'password';
      passwordField.type = hidden ? 'text' : 'password';
      toggle.textContent = hidden ? 'Hide' : 'Show';
    });

    if (!token) {
      errorEl.textContent = 'Missing reset token. Please request a new link.';
      submitBtn.disabled = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';
      try {
        const res = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: new FormData(form).get('password').toString() }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.style.color = 'var(--danger)';
          errorEl.textContent = data.error || 'Reset failed';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }
        errorEl.style.color = 'var(--primary)';
        errorEl.textContent = 'Password updated. Redirecting...';
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
      } catch {
        errorEl.textContent = 'Network error — please try again';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
