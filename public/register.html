<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: white; border-radius: var(--radius); padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
    .login-card h1 { color: var(--primary); font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
    .login-card .subtitle { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 1.5rem; }
    .password-wrap { position: relative; }
    .password-wrap input { width: 100%; padding-right: 3.5rem; }
    .toggle-password { position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--primary); cursor: pointer; font-size: 0.8rem; font-weight: 600; padding: 0.3rem 0.5rem; border-radius: 4px; }
    .toggle-password:hover { background: var(--primary-light); }
    .form-error { color: var(--danger); font-size: 0.8rem; font-weight: 500; text-align: center; min-height: 1.2rem; }
    .login-footer { text-align: center; margin-top: 1rem; }
    .login-footer a { color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/doctor-details.html">Doctors</a>
      <a href="/login.html">Login</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Create account</h1>
      <p class="subtitle">Register to start booking appointments</p>

      <form id="register-form">
        <input type="text" name="name" placeholder="Full name" required autocomplete="name" />
        <input type="email" name="email" placeholder="Email address" required autocomplete="email" />
        <input type="tel" name="phone" placeholder="Phone number" required autocomplete="tel" />
        <div class="password-wrap">
          <input id="password-field" type="password" name="password" placeholder="Password" required autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggle-password">Show</button>
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
      </form>

      <p class="login-footer">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { saveAuth, getToken } from './auth.js';

    if (getToken()) window.location.href = '/home.html';

    const form = document.getElementById('register-form');
    const passwordField = document.getElementById('password-field');
    const togglePassword = document.getElementById('toggle-password');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordField.type === 'password';
      passwordField.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const fd = new FormData(form);
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: fd.get('name').toString().trim(),
            email: fd.get('email').toString().trim(),
            phone: fd.get('phone').toString().trim(),
            password: fd.get('password').toString(),
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Registration failed';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        saveAuth(data.token, data.user);
        window.location.href = '/home.html';
      } catch {
        errorEl.textContent = 'Network error — please try again';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
