<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/doctor-details.html">Doctors</a>
      <a href="/login.html">Login</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <div class="auth-kicker">Register</div>
      <h1>Create account</h1>
      <p class="subtitle">Register to start booking appointments</p>

      <form id="register-form">
        <input type="text" name="name" placeholder="Full name" required autocomplete="name" />
        <input type="email" name="email" placeholder="Email address" required autocomplete="email" />
        <input type="tel" name="phone" placeholder="Phone number" required autocomplete="tel" />
        <select name="role" id="role-select">
          <option value="patient">Patient</option>
          <option value="doctor">Doctor</option>
        </select>
        <div id="doctor-fields" style="display:none;">
          <input type="text" name="specialty" placeholder="Specialty (e.g. Cardiology)" />
          <input type="text" name="clinic" placeholder="Clinic name (optional)" />
        </div>
        <div class="password-wrap">
          <input id="password-field" type="password" name="password" placeholder="Password (min 8 chars)" required autocomplete="new-password" />
          <button type="button" class="toggle-password" id="toggle-password">Show</button>
        </div>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
      </form>

      <p class="login-footer">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script type="module">
    import { saveAuth, getToken } from './auth.js';

    if (getToken()) window.location.href = '/home.html';

    const form = document.getElementById('register-form');
    const passwordField = document.getElementById('password-field');
    const togglePassword = document.getElementById('toggle-password');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordField.type === 'password';
      passwordField.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
    });

    document.getElementById('role-select').addEventListener('change', (e) => {
      document.getElementById('doctor-fields').style.display = e.target.value === 'doctor' ? 'grid' : 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const fd = new FormData(form);
      const payload = {
        name: fd.get('name').toString().trim(),
        email: fd.get('email').toString().trim(),
        phone: fd.get('phone').toString().trim(),
        password: fd.get('password').toString(),
        role: fd.get('role')?.toString() || 'patient',
        specialty: fd.get('specialty')?.toString().trim() || '',
        clinic: fd.get('clinic')?.toString().trim() || '',
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.error || 'Registration failed';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          return;
        }

        saveAuth(data.token, data.user);
        window.location.href = '/home.html';
      } catch {
        errorEl.textContent = 'Network error — please try again';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
