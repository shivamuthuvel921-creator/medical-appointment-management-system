<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — MedCare</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: white; border-radius: var(--radius); padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg); }
    .login-card h1 { color: var(--primary); font-size: 1.4rem; font-weight: 700; margin-bottom: 0.25rem; }
    .login-card .subtitle { font-size: 0.85rem; color: var(--gray-400); margin-bottom: 1.5rem; }
    .form-error { color: var(--danger); font-size: 0.8rem; font-weight: 500; text-align: center; min-height: 1.2rem; }
    .login-footer { text-align: center; margin-top: 1rem; }
    .login-footer a { color: var(--primary); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="topbar">
    <span class="topbar-brand">MedCare</span>
    <div class="topbar-links">
      <a href="/home.html">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Reset password</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="forgot-form">
        <input type="email" name="email" placeholder="Email address" required autocomplete="email" />
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Send Reset Link</button>
      </form>

      <p class="login-footer"><a href="/login.html">Back to login</a></p>
    </div>
  </div>

  <script type="module">
    const form = document.getElementById('forgot-form');
    const errorEl = document.getElementById('form-error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      try {
        const res = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: new FormData(form).get('email').toString().trim() }),
        });
        const data = await res.json();
        errorEl.style.color = 'var(--primary)';
        errorEl.textContent = data.message || data.error || 'Please try again.';
      } catch {
        errorEl.textContent = 'Network error — please try again';
      }
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
